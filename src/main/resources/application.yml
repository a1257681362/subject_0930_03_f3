server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 文物多角度影像归档（museum-2）
museum:
  image:
    # 内容寻址物理存储根目录（SHA-256 分桶），作废不删文件
    storage-root: ./data/images
    # 归档分辨率下限（像素），低于即逐张拒收
    min-width-px: 800
    min-height-px: 800
  # 修复材料批号与用量核算（museum-3）
  material:
    # 计划/实际用量差异复核阈值（%），实际相对计划偏差严格超过该值触发复核
    variance-threshold-pct: 20
    # 差异复核定时扫描间隔（毫秒）；重启后启动即补扫一次，扫描按明细行幂等
    review-scan-interval-ms: 60000
    review-scan-on-startup: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO

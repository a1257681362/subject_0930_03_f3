server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 文物多角度影像归档（museum-2）
museum:
  image:
    # 内容寻址物理存储根目录（SHA-256 分桶），作废不删文件
    storage-root: ./data/images
    # 归档分辨率下限（像素），低于即逐张拒收
    min-width-px: 800
    min-height-px: 800
  # 修复材料批号与用量核算（museum-3）
  material:
    # 计划用量与实际用量差异复核默认阈值（百分比，严格超过才触发复核）
    review-threshold-percent: 10.00
    # 用量差异定时扫描 cron（默认每天 08:00）；重启后重扫靠唯一约束保证不多写
    review-scan-cron: "0 0 8 * * ?"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO
